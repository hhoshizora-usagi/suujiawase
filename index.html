<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>みーたん数字当てゲーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #fdf6f0;
    --card: #ffffff;
    --primary: #ff7eb3;
    --primary-dark: #e8609a;
    --accent: #7c5cfc;
    --green: #4caf50;
    --yellow: #ffc107;
    --gray-cell: #bdbdbd;
    --gray-dark: #9e9e9e;
    --text: #3d3d3d;
    --text-light: #888;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    min-height: 100vh;
    overflow-y: auto;
    display: block;
    text-align: center;
    padding: 12px 16px 40px;
    -webkit-text-size-adjust: 100%;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--primary-dark);
    margin-top: 4px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 10px;
  }

  .mitan {
    font-size: 3rem;
    margin: 4px 0;
    line-height: 1.2;
  }
  .mitan-msg {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent);
    min-height: 1.6em;
    margin-bottom: 8px;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 10px;
  }
  .stat-item { text-align: center; }
  .stat-value { font-size: 1.3rem; font-weight: 900; color: var(--accent); }
  .stat-label { font-size: 0.65rem; color: var(--text-light); font-weight: 700; }

  /* ── Difficulty screen ── */
  #difficulty-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }

  .diff-btn {
    width: 100%;
    padding: 18px 16px;
    border: none;
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .diff-btn:active { transform: scale(0.97); }
  .diff-icon { font-size: 2rem; flex-shrink: 0; }
  .diff-info { display: flex; flex-direction: column; }
  .diff-name { font-size: 1.15rem; font-weight: 900; }
  .diff-desc { font-size: 0.8rem; color: var(--text-light); margin-top: 2px; }
  .diff-btn.easy .diff-name { color: #4caf50; }
  .diff-btn.normal .diff-name { color: #ff9800; }
  .diff-btn.hard .diff-name { color: #f44336; }

  /* ── Game screen ── */
  #game-screen {
    display: none;
    max-width: 400px;
    margin: 0 auto;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .game-info { font-size: 0.85rem; color: var(--text-light); font-weight: 700; }
  .game-info span { color: var(--primary-dark); }

  .back-btn {
    background: none;
    border: 2px solid var(--gray-cell);
    color: var(--text-light);
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-light);
  }
  .legend-dot {
    width: 18px; height: 18px;
    border-radius: 6px;
    display: inline-block;
  }
  .legend-dot.g { background: var(--green); }
  .legend-dot.y { background: var(--yellow); }
  .legend-dot.x { background: var(--gray-cell); }

  /* ── Guess grid ── */
  #guesses {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .guess-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }

  .row-number {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gray-dark);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .guess-cell {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 900;
    background-color: #ffffff;
    border: 3px solid #e0e0e0;
    color: #3d3d3d;
  }
  .guess-cell.active {
    border-color: var(--primary);
  }
  .guess-cell.future {
    background-color: #f5f0eb;
    border-color: #e0dbd6;
  }
  .guess-cell.cell-correct {
    background-color: #4caf50 !important;
    border-color: #4caf50 !important;
    color: #ffffff !important;
  }
  .guess-cell.cell-present {
    background-color: #ffc107 !important;
    border-color: #ffc107 !important;
    color: #ffffff !important;
  }
  .guess-cell.cell-absent {
    background-color: #bdbdbd !important;
    border-color: #bdbdbd !important;
    color: #ffffff !important;
  }

  @keyframes cell-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .cell-anim {
    animation: cell-pop 0.35s ease forwards;
  }

  /* ── Numpad ── */
  #numpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 320px;
    margin: 0 auto;
  }

  .num-btn {
    padding: 14px 0;
    border: none;
    border-radius: 12px;
    background: var(--card);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    font-size: 1.3rem;
    font-weight: 900;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  .num-btn:active { transform: scale(0.92); background: #e0d4ff; }

  .num-btn.action-del {
    background: #ffe0e0;
    color: #e53935;
    font-size: 1.1rem;
  }

  .num-btn.action-enter {
    background: var(--primary);
    color: #fff;
    font-size: 1rem;
    grid-column: span 2;
  }
  .num-btn.action-enter:active { background: var(--primary-dark); }
  .num-btn.action-enter.disabled {
    background: #ddd;
    color: #aaa;
    pointer-events: none;
  }

  /* ── Result overlay ── */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .result-card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px;
    text-align: center;
    max-width: 340px;
    width: 90%;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .result-emoji { font-size: 4rem; margin-bottom: 8px; }
  .result-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 6px; }
  .result-sub { font-size: 0.9rem; color: var(--text-light); margin-bottom: 16px; line-height: 1.5; }
  .result-answer { font-size: 2rem; font-weight: 900; color: var(--accent); letter-spacing: 8px; margin-bottom: 18px; }

  .result-btn {
    padding: 14px 28px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin: 0 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-retry { background: var(--primary); color: #fff; }
  .btn-retry:active { background: var(--primary-dark); }
  .btn-menu { background: #f0f0f0; color: var(--text); }

  /* ── Fireworks ── */
  #fireworks {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 101;
  }
  .particle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ── Responsive ── */
  @media (max-width: 360px) {
    .guess-cell { width: 48px; height: 48px; font-size: 1.3rem; }
    .num-btn { padding: 12px 0; font-size: 1.15rem; }
  }
</style>
</head>
<body>

<div class="mitan" id="mitan-face">🐰</div>
<h1>みーたん数字当てゲーム</h1>
<p class="subtitle">みーたんが決めた秘密の数字を当てよう！</p>
<div class="mitan-msg" id="mitan-msg">難易度を選んでね💛</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-value" id="stat-played">0</div><div class="stat-label">プレイ数</div></div>
  <div class="stat-item"><div class="stat-value" id="stat-wins">0</div><div class="stat-label">クリア</div></div>
  <div class="stat-item"><div class="stat-value" id="stat-rate">0%</div><div class="stat-label">クリア率</div></div>
  <div class="stat-item"><div class="stat-value" id="stat-streak">0</div><div class="stat-label">連勝</div></div>
</div>

<div id="difficulty-screen">
  <button class="diff-btn easy" onclick="startGame(2, 5)">
    <div class="diff-icon">⭐</div>
    <div class="diff-info">
      <div class="diff-name">かんたん</div>
      <div class="diff-desc">2桁 ・ 5回チャンス</div>
    </div>
  </button>
  <button class="diff-btn normal" onclick="startGame(3, 6)">
    <div class="diff-icon">⭐⭐</div>
    <div class="diff-info">
      <div class="diff-name">ふつう</div>
      <div class="diff-desc">3桁 ・ 6回チャンス</div>
    </div>
  </button>
  <button class="diff-btn hard" onclick="startGame(4, 7)">
    <div class="diff-icon">⭐⭐⭐</div>
    <div class="diff-info">
      <div class="diff-name">むずかしい</div>
      <div class="diff-desc">4桁 ・ 7回チャンス</div>
    </div>
  </button>
</div>

<div id="game-screen">
  <div class="game-header">
    <div class="game-info">残り <span id="remaining">6</span> 回</div>
    <button class="back-btn" onclick="goToMenu()">メニューへ</button>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot g"></span> 正解</div>
    <div class="legend-item"><span class="legend-dot y"></span> 位置ちがう</div>
    <div class="legend-item"><span class="legend-dot x"></span> はずれ</div>
  </div>
  <div id="guesses"></div>
  <div id="numpad"></div>
</div>

<div id="result-overlay" style="display:none;"></div>
<div id="fireworks"></div>

<script>
(function() {
  'use strict';

  // ── State ──
  var secret = [];
  var digits = 3;
  var maxGuesses = 6;
  var currentRow = 0;
  var currentCol = 0;
  var currentGuess = [];
  var gameOver = false;
  var submitting = false; // prevent double-submit

  // ── DOM helpers ──
  function $(id) { return document.getElementById(id); }

  function setMitan(face, msg) {
    $('mitan-face').textContent = face;
    $('mitan-msg').textContent = msg;
  }

  // ── Stats ──
  function loadStats() {
    try {
      var s = JSON.parse(localStorage.getItem('mitan-numgame-stats'));
      if (s && typeof s.played === 'number') return s;
    } catch(e) {}
    return { played: 0, wins: 0, streak: 0, maxStreak: 0 };
  }
  function saveStats(s) {
    try { localStorage.setItem('mitan-numgame-stats', JSON.stringify(s)); } catch(e) {}
  }
  function renderStats() {
    var s = loadStats();
    $('stat-played').textContent = s.played;
    $('stat-wins').textContent = s.wins;
    $('stat-rate').textContent = s.played ? Math.round(s.wins / s.played * 100) + '%' : '0%';
    $('stat-streak').textContent = s.streak;
  }

  // ── Secret generation ──
  function generateSecret(n) {
    var arr = [];
    while (arr.length < n) {
      var d = Math.floor(Math.random() * 10);
      if (arr.indexOf(d) === -1) arr.push(d);
    }
    return arr;
  }

  // ── Messages ──
  var msgs = {
    start: ['うさちゃん、当ててみて〜！', 'ふふっ、当てられるかな？🤭', '準備OK！いくよ〜💛'],
    wrong: ['惜しい…かも？🤔', 'まだまだ〜！', 'もうちょっと！💪', 'ヒントはあげないよ〜😤'],
    close: ['あっ…近い近い！👀', 'いい線いってる！✨', 'もう少しだよ〜！'],
    win: ['すごーい！大正解🎉', 'やったね！天才じゃん💛', 'パーフェクト！🌟'],
    lose: ['残念…でもまた挑戦してね💛', 'ドンマイ！次は当てようね🐰', '答えはこれだったよ〜😉'],
    last: ['ラストチャンス…！😰', '最後の1回…ドキドキ💓']
  };
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ── Evaluate guess ──
  function evaluate(guess, answer) {
    var len = guess.length;
    var result = [];
    var answerUsed = [];
    var guessUsed = [];
    var i, j;
    for (i = 0; i < len; i++) {
      result[i] = 'absent';
      answerUsed[i] = false;
      guessUsed[i] = false;
    }
    // Pass 1: exact matches
    for (i = 0; i < len; i++) {
      if (guess[i] === answer[i]) {
        result[i] = 'correct';
        answerUsed[i] = true;
        guessUsed[i] = true;
      }
    }
    // Pass 2: wrong position
    for (i = 0; i < len; i++) {
      if (guessUsed[i]) continue;
      for (j = 0; j < len; j++) {
        if (!answerUsed[j] && guess[i] === answer[j]) {
          result[i] = 'present';
          answerUsed[j] = true;
          break;
        }
      }
    }
    return result;
  }

  // ── Get cell ──
  function getCell(r, c) {
    return $('c' + r + '-' + c);
  }

  // ── Build grid ──
  function buildGrid() {
    var html = '';
    for (var r = 0; r < maxGuesses; r++) {
      html += '<div class="guess-row"><div class="row-number">' + (r + 1) + '</div>';
      for (var c = 0; c < digits; c++) {
        var cls = 'guess-cell';
        if (r > 0) cls += ' future';
        html += '<div class="' + cls + '" id="c' + r + '-' + c + '"></div>';
      }
      html += '</div>';
    }
    $('guesses').innerHTML = html;
  }

  // ── Build numpad ──
  function buildNumpad() {
    var html = '';
    for (var i = 1; i <= 9; i++) {
      html += '<button class="num-btn" data-digit="' + i + '">' + i + '</button>';
    }
    html += '<button class="num-btn action-del" data-action="del">⌫</button>';
    html += '<button class="num-btn" data-digit="0">0</button>';
    html += '<button class="num-btn action-enter disabled" id="enter-btn" data-action="enter">決定</button>';
    $('numpad').innerHTML = html;
  }

  // ── Numpad event delegation ──
  $('numpad').addEventListener('click', function(e) {
    var btn = e.target.closest('.num-btn');
    if (!btn) return;
    if (btn.dataset.digit !== undefined) {
      inputDigit(parseInt(btn.dataset.digit, 10));
    } else if (btn.dataset.action === 'del') {
      deleteDigit();
    } else if (btn.dataset.action === 'enter') {
      submitGuess();
    }
  });

  // ── Highlight active cell ──
  function highlightActive() {
    for (var c = 0; c < digits; c++) {
      var cell = getCell(currentRow, c);
      if (!cell) continue;
      if (c === currentCol && !gameOver && !submitting) {
        cell.classList.add('active');
      } else {
        cell.classList.remove('active');
      }
    }
  }

  // ── Update enter button ──
  function updateEnterBtn() {
    var btn = $('enter-btn');
    if (!btn) return;
    if (currentGuess.length === digits && !submitting) {
      btn.classList.remove('disabled');
    } else {
      btn.classList.add('disabled');
    }
  }

  // ── Input digit ──
  function inputDigit(d) {
    if (gameOver || submitting || currentCol >= digits) return;
    var cell = getCell(currentRow, currentCol);
    if (!cell) return;
    cell.textContent = String(d);
    currentGuess.push(d);
    currentCol++;
    highlightActive();
    updateEnterBtn();
  }

  // ── Delete digit ──
  function deleteDigit() {
    if (gameOver || submitting || currentCol <= 0) return;
    currentCol--;
    var cell = getCell(currentRow, currentCol);
    if (!cell) return;
    cell.textContent = '';
    currentGuess.pop();
    highlightActive();
    updateEnterBtn();
  }

  // ── Check duplicates ──
  function hasDuplicates(arr) {
    var seen = {};
    for (var i = 0; i < arr.length; i++) {
      if (seen[arr[i]]) return true;
      seen[arr[i]] = true;
    }
    return false;
  }

  // ── Shake row ──
  function shakeRow(row) {
    for (var c = 0; c < digits; c++) {
      var cell = getCell(row, c);
      if (!cell) continue;
      cell.style.animation = 'none';
      void cell.offsetWidth; // force reflow
      cell.style.animation = 'shake 0.4s ease';
    }
  }

  // ── Submit guess ──
  function submitGuess() {
    if (gameOver || submitting) return;
    if (currentGuess.length !== digits) return;

    // Check duplicates
    if (hasDuplicates(currentGuess)) {
      setMitan('😤', '同じ数字は使えないよ〜！');
      shakeRow(currentRow);
      return;
    }

    submitting = true;
    updateEnterBtn();

    var result = evaluate(currentGuess, secret);
    var correctCount = 0;
    var presentCount = 0;
    for (var k = 0; k < result.length; k++) {
      if (result[k] === 'correct') correctCount++;
      if (result[k] === 'present') presentCount++;
    }

    // Animate each cell sequentially
    var delay = 0;
    for (var c = 0; c < digits; c++) {
      (function(col, res) {
        setTimeout(function() {
          var cell = getCell(currentRow, col);
          if (!cell) return;

          // Remove old state classes
          cell.classList.remove('active', 'future');

          // Add result class
          if (res === 'correct') {
            cell.classList.add('cell-correct');
          } else if (res === 'present') {
            cell.classList.add('cell-present');
          } else {
            cell.classList.add('cell-absent');
          }

          // Pop animation
          cell.classList.remove('cell-anim');
          void cell.offsetWidth;
          cell.classList.add('cell-anim');
        }, col * 200);
      })(c, result[c]);
      delay = c * 200;
    }

    // After all cells animated, check win/loss
    setTimeout(function() {
      if (correctCount === digits) {
        // WIN
        gameOver = true;
        submitting = false;

        var stats = loadStats();
        stats.played++;
        stats.wins++;
        stats.streak++;
        if (stats.streak > (stats.maxStreak || 0)) stats.maxStreak = stats.streak;
        saveStats(stats);
        renderStats();

        setMitan('🎊', pick(msgs.win));

        setTimeout(function() {
          showResult(true, currentRow + 1);
          launchFireworks();
        }, 400);
      } else {
        currentRow++;
        if (currentRow >= maxGuesses) {
          // LOSE
          gameOver = true;
          submitting = false;

          var stats2 = loadStats();
          stats2.played++;
          stats2.streak = 0;
          saveStats(stats2);
          renderStats();

          setMitan('😢', pick(msgs.lose));

          setTimeout(function() {
            showResult(false, 0);
          }, 400);
        } else {
          // CONTINUE
          submitting = false;
          $('remaining').textContent = String(maxGuesses - currentRow);

          // Make next row active (remove future class)
          for (var c2 = 0; c2 < digits; c2++) {
            var nextCell = getCell(currentRow, c2);
            if (nextCell) nextCell.classList.remove('future');
          }

          if (maxGuesses - currentRow === 1) {
            setMitan('😰', pick(msgs.last));
          } else if (correctCount + presentCount >= digits - 1) {
            setMitan('👀', pick(msgs.close));
          } else {
            setMitan('🐰', pick(msgs.wrong));
          }

          currentCol = 0;
          currentGuess = [];
          highlightActive();
          updateEnterBtn();
        }
      }
    }, delay + 400);
  }

  // ── Show result overlay ──
  function showResult(won, attempts) {
    var emoji = won ? '🎉' : '😢';
    var title = won ? 'おめでとう！🐰✨' : 'ざんねん…💦';
    var sub = won ? (attempts + '回目で正解！') : 'また挑戦してね💛';
    var answer = secret.join(' ');

    var html = '<div class="overlay" onclick="event.stopPropagation()">' +
      '<div class="result-card">' +
      '<div class="result-emoji">' + emoji + '</div>' +
      '<div class="result-title">' + title + '</div>' +
      '<div class="result-sub">' + sub + '</div>' +
      '<div class="result-answer">' + answer + '</div>' +
      '<div>' +
      '<button class="result-btn btn-retry" id="btn-retry">もう一回</button>' +
      '<button class="result-btn btn-menu" id="btn-menu-result">メニュー</button>' +
      '</div>' +
      '</div></div>';

    var overlay = $('result-overlay');
    overlay.innerHTML = html;
    overlay.style.display = 'block';

    // Bind buttons
    $('btn-retry').addEventListener('click', function() { retryGame(); });
    $('btn-menu-result').addEventListener('click', function() { goToMenu(); });
  }

  function hideResult() {
    var overlay = $('result-overlay');
    overlay.style.display = 'none';
    overlay.innerHTML = '';
  }

  // ── Fireworks ──
  function launchFireworks() {
    var container = $('fireworks');
    container.innerHTML = '';
    var colors = ['#ff7eb3', '#7c5cfc', '#4caf50', '#ffc107', '#ff5722', '#2196f3', '#e91e63'];
    var w = window.innerWidth || 400;
    var h = window.innerHeight || 600;

    for (var burst = 0; burst < 5; burst++) {
      (function(b) {
        setTimeout(function() {
          var cx = Math.random() * w;
          var cy = Math.random() * h * 0.6;
          for (var i = 0; i < 18; i++) {
            var p = document.createElement('div');
            p.className = 'particle';
            p.style.left = cx + 'px';
            p.style.top = cy + 'px';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            var angle = (Math.PI * 2 / 18) * i;
            var dist = 50 + Math.random() * 80;
            p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
            p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
            p.style.animationDelay = (Math.random() * 0.2) + 's';
            container.appendChild(p);
          }
        }, b * 300);
      })(burst);
    }

    setTimeout(function() { container.innerHTML = ''; }, 3000);
  }

  // ── Start game ──
  window.startGame = function(d, m) {
    digits = d;
    maxGuesses = m;
    secret = generateSecret(d);
    currentRow = 0;
    currentCol = 0;
    currentGuess = [];
    gameOver = false;
    submitting = false;

    console.log('[みーたん] 秘密の数字:', secret.join(''));

    $('difficulty-screen').style.display = 'none';
    $('game-screen').style.display = 'block';
    $('remaining').textContent = String(maxGuesses);
    hideResult();
    $('fireworks').innerHTML = '';

    setMitan('🐰', pick(msgs.start));
    buildGrid();
    buildNumpad();
    highlightActive();
    updateEnterBtn();
  };

  // ── Retry ──
  window.retryGame = function() {
    hideResult();
    $('fireworks').innerHTML = '';
    window.startGame(digits, maxGuesses);
  };

  // ── Menu ──
  window.goToMenu = function() {
    hideResult();
    $('fireworks').innerHTML = '';
    $('game-screen').style.display = 'none';
    $('difficulty-screen').style.display = 'flex';
    gameOver = true;
    submitting = false;
    setMitan('🐰', '難易度を選んでね💛');
  };

  // ── Keyboard ──
  document.addEventListener('keydown', function(e) {
    if (gameOver || submitting) return;
    if ($('game-screen').style.display === 'none') return;
    var key = e.key;
    if (key >= '0' && key <= '9') {
      e.preventDefault();
      inputDigit(parseInt(key, 10));
    } else if (key === 'Backspace') {
      e.preventDefault();
      deleteDigit();
    } else if (key === 'Enter') {
      e.preventDefault();
      submitGuess();
    }
  });

  // ── Init ──
  renderStats();
})();
</script>

</body>
</html>
